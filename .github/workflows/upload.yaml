on:
  schedule:
    - cron: '04 0-1,3-23 * * *'  # every hour at :04 ...
    - cron: '04 2 * * *'  # ... and at 2:04, the daily run that re-checks a week of bookmarks
  workflow_dispatch:

name: 🚀 Publish my stars
jobs:
  summarize-bookmarks:
    name: 📝 Summarize bookmarks
    runs-on: ubuntu-latest
    environment: default
    permissions:
      contents: read
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v7

    - name: Install uv and enable caching
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      run: uv python install

    - name: Install the project
      run: uv sync --no-dev

    - name: 📝 Fill empty or generic linkding descriptions
      # hourly runs look at new bookmarks only, so pages that cannot be summarized
      # are not retried every hour; the daily run (and manual runs) cover the last week
      run: uv run --no-dev python bookmark_summaries.py --apply --log-level INFO $WINDOW
      env:
        LINKDING_API_TOKEN: ${{ secrets.LINKDING_API_TOKEN }}
        KAGI_API_TOKEN: ${{ secrets.KAGI_API_TOKEN }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        WINDOW: ${{ github.event.schedule == '04 0-1,3-23 * * *' && '--hours 3' || '' }}

  rss-deploy:
    name: 🎉 Deploy RSS feed
    needs: summarize-bookmarks
    if: ${{ !cancelled() }}  # publish the feed even if summarizing failed
    runs-on: ubuntu-latest
    environment: default
    permissions:
      contents: read
      issues: write   # to open the LinkedIn token reminder issue
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v7

    - name: Install uv and enable caching
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      run: uv python install        

    - name: Install the project
      run: uv sync --no-dev

    - name: Restore title cache
      uses: actions/cache@v6
      with:
        path: title-generator.cache
        key: titles-${{ github.run_id }}
        restore-keys: titles-

    - name: Build RSS file
      run: mkdir build && uv run rss.py --limit 200 > build/stars.rss
      env:
        MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        LINKEDIN_TOKEN_EXPIRES: ${{ vars.LINKEDIN_TOKEN_EXPIRES }}
        FEEDBIN_ID: ${{ secrets.FEEDBIN_ID }}
        LINKDING_ID: ${{ secrets.LINKDING_ID }}
        
    - name: ✅ Validate RSS
      run: uv run --no-dev python validate_feed.py < build/stars.rss

    - name: 🔍 Compare with the published feed
      id: feed
      run: uv run --no-dev python feed_changed.py build/stars.rss https://rss.ping13.net/stars.rss >> "$GITHUB_OUTPUT"

    - name: 📂 Copy RSS 
      uses: SamKirkland/FTP-Deploy-Action@v4.4.0
      with:
        server: ${{ vars.FTP_SERVER }}
        username: ${{ vars.FTP_USER }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./build/
        server-dir: public_html/rss/

    - name: ⭐ Rebuild favorites page on the blog
      if: steps.feed.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ secrets.BLOG_DISPATCH_TOKEN }}
      run: gh workflow run favorites.yaml --repo ping13/blog --ref main

    - name: 🔔 Remind about blog dispatch token
      if: always()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        EXPIRES: ${{ vars.BLOG_DISPATCH_TOKEN_EXPIRES }}
      run: |
        [ -n "$EXPIRES" ] || exit 0
        days=$(( ( $(date -d "$EXPIRES" +%s) - $(date +%s) ) / 86400 ))
        [ "$days" -lt 30 ] || exit 0
        title="Blog dispatch token expires soon: renew it"
        open=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
        [ -z "$open" ] || exit 0
        gh issue create --title "$title" --body "The token that starts the blog's favorites workflow expires on $EXPIRES ($days days left). Once it has expired, the feed is still published, but the favorites page on the blog is only refreshed by the nightly blog deploy.

        1. Regenerate the fine-grained token *star-collector-blog-dispatch* (repository ping13/blog, Actions: Read and write): https://github.com/settings/personal-access-tokens
        2. Store it and the new expiry date:

        \`\`\`bash
        gh secret set BLOG_DISPATCH_TOKEN --env default --repo $GH_REPO
        gh variable set BLOG_DISPATCH_TOKEN_EXPIRES --repo $GH_REPO --body YYYY-MM-DD
        \`\`\`

        Close this issue afterwards."

    - name: 🔔 Remind about LinkedIn token
      if: always()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        EXPIRES: ${{ vars.LINKEDIN_TOKEN_EXPIRES }}
      run: |
        [ -n "$EXPIRES" ] || exit 0
        days=$(( ( $(date -d "$EXPIRES" +%s) - $(date +%s) ) / 86400 ))
        [ "$days" -lt 30 ] || exit 0
        title="LinkedIn token expires soon: renew it"
        open=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
        [ -z "$open" ] || exit 0
        gh issue create --title "$title" --body "The LinkedIn access token expires on $EXPIRES ($days days left). Until it is renewed, LinkedIn items are served from the stored state only.

        Renew it locally (opens the LinkedIn consent page, updates .env, the GitHub secret and the expiry variable):

        \`\`\`bash
        make linkedin-token-ci
        \`\`\`

        Close this issue afterwards."

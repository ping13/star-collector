mastodon:
  access_token: ${MASTODON_ACCESS_TOKEN}
  mastodon_instance: https://swiss.social
  mastodon_username: ping13
  feed_item_limit: 5
  types:
    - favourites
#    - bookmarks

rss:
  urls:
    - url: https://bookmarks.ping13.net/feeds/${LINKDING_ID}/all
      tag: linkding
    # - url: https://feedbin.com/starred/${FEEDBIN_ID}.xml
    #   tag: feedbin
  exclude_categories:
    - private
    - c13n
    - c15n
    - c15n-it
  

  



# Optional: headline generation via OpenRouter (needs OPENROUTER_API_KEY)
titles:
  model: anthropic/claude-haiku-5.5
  fallback_model: qwen/qwen3.7-flash
  max_new_titles_per_run: 100

# Optional: LinkedIn reactions (needs LINKEDIN_ACCESS_TOKEN, see `make linkedin-token`)
linkedin:
  enabled: true
  exclude_reactions: [LIKE]
  max_items: 50
  state_file: build/linkedin-state.json
  state_url: https://rss.ping13.net/linkedin-state.json

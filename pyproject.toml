[project]
name = "star-collector"
version = "0.1.0"
description = "RSS feed of my starred items from Mastodon and other sources"
authors = [
    {name = "Stephan Heuel", email = "mail@ping13.net"}
]
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
    "click>=8.1.7",
    "feedgen>=1.0.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "feedparser>=6.0.11",
    "python-dateutil>=2.9.0.post0",
    "envyaml>=1.10.211231",
    "transformers>=4.50.0",
    "torch>=2.5.1",
    "html2text>=2024.2.26",
    "diskcache>=5.6.3",
    "beautifulsoup4>=4.12.3",
    "tenacity>=8.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.8.0",
    "discord-py>=2.5.2",  # only for summarize_stars.py
]

[tool.ruff]
extend-exclude = ["linkedin_test.py", "summarize_stars.py"]  # scratch experiments

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
